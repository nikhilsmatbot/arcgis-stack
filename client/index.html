<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArcGIS Pincode & Route Demo</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Pincode &amp; Route Demo</h1>
      <p>ArcGIS geocoding and routing behind a small Express API.</p>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <form id="search-form" class="block" novalidate>
          <label for="pincode">Pincode</label>
          <input id="pincode" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="e.g. 110001" />
          <p id="search-message" class="message" role="status" aria-live="polite"></p>
        </form>

        <div class="results-header">
          <h2>Results</h2>
          <span id="results-count" class="count"></span>
        </div>
        <ul id="results" class="results"></ul>

        <section class="block route-block">
          <h2>Route</h2>
          <label for="from-select">From</label>
          <select id="from-select" disabled></select>
          <label for="to-select">To</label>
          <select id="to-select" disabled></select>
          <button id="route-btn" type="button" disabled>Get route</button>
          <p id="route-info" class="message info" role="status" aria-live="polite"></p>
        </section>
      </aside>

      <section class="map-wrap">
        <div id="map" aria-label="Map of matching places and route"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
